<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Garmin 165 Sleep AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl shadow">
      <div>
        <h1 class="text-lg font-bold text-sky-400">Phân Tích Giấc Ngủ FR165</h1>
        <p id="date-label" class="text-xs text-slate-400">Đang tải dữ liệu...</p>
      </div>
      <div class="text-right">
        <span id="score" class="text-3xl font-extrabold text-emerald-400">--</span>
        <span class="text-xs text-slate-400 block">Điểm ngủ</span>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-slate-800 p-3 rounded-2xl">
        <p class="text-xs text-slate-400">Tổng giờ ngủ</p>
        <p id="total-hours" class="text-xl font-bold mt-1">--h</p>
      </div>
      <div class="bg-slate-800 p-3 rounded-2xl">
        <p class="text-xs text-slate-400">Nhịp tim nghỉ</p>
        <p id="rhr" class="text-xl font-bold text-rose-400 mt-1">-- bpm</p>
      </div>
      <div class="bg-slate-800 p-3 rounded-2xl">
        <p class="text-xs text-slate-400">Stress lúc ngủ</p>
        <p id="stress" class="text-xl font-bold text-amber-400 mt-1">--</p>
      </div>
    </div>

    <div class="bg-slate-800 p-4 rounded-2xl">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">Cấu trúc giấc ngủ (Phút)</h2>
      <div class="w-48 mx-auto">
        <canvas id="sleepChart"></canvas>
      </div>
    </div>

    <div class="bg-slate-800 p-4 rounded-2xl border border-sky-500/40 space-y-3">
      <h2 class="text-sm font-bold text-sky-400 uppercase tracking-wider">🤖 AI Huấn Luyện Viên Sức Khỏe</h2>
      <div class="bg-slate-900/60 p-3 rounded-xl border-l-4 border-amber-400">
        <p class="text-xs text-amber-400 font-semibold">🛌 Có nên ngủ thêm?</p>
        <p id="ai-sleep-more" class="text-sm font-bold text-white mt-1">Đang tải...</p>
      </div>
      <div>
        <p class="text-xs text-slate-400 font-semibold">🩺 Chất lượng cơ thể sáng nay:</p>
        <p id="ai-health" class="text-sm text-slate-200 mt-0.5 leading-relaxed">--</p>
      </div>
      <div>
        <p class="text-xs text-emerald-400 font-semibold">🏃‍♂️ Hôm nay nên làm gì?</p>
        <p id="ai-todo" class="text-sm text-slate-200 mt-0.5 leading-relaxed">--</p>
      </div>
      <p id="updated-time" class="text-[11px] text-slate-500 pt-2 text-right"></p>
    </div>
  </div>

  <script>
    // THAY ĐƯỜNG DẪN FIREBASE CỦA BẠN VÀO DÒNG DƯỚI ĐÂY:
    const FIREBASE_URL = "https://TEN-PROJECT-CUA-BAN.firebaseio.com";

    async function loadSleepData() {
      try {
        const res = await fetch([https://garmin165-default-rtdb.asia-southeast1.firebasedatabase.app]);
        const data = await res.json();
        if (!data) return;

        document.getElementById("date-label").innerText = `Ngày: ${data.date}`;
        document.getElementById("score").innerText = data.score;
        document.getElementById("total-hours").innerText = `${data.total_hours}h`;
        document.getElementById("rhr").innerText = `${data.rhr} bpm`;
        document.getElementById("stress").innerText = data.stress;
        document.getElementById("ai-sleep-more").innerText = data.ai_sleep_more || "Chưa có dữ liệu";
        document.getElementById("ai-health").innerText = data.ai_health || "";
        document.getElementById("ai-todo").innerText = data.ai_todo || "";
        document.getElementById("updated-time").innerText = `Cập nhật lúc: ${data.updated_at}`;

        new Chart(document.getElementById("sleepChart"), {
          type: 'doughnut',
          data: {
            labels: ['Ngủ sâu', 'Ngủ nông', 'REM', 'Thức'],
            datasets: [{
              data: [data.deep_min, data.light_min, data.rem_min, data.awake_min],
              backgroundColor: ['#3b82f6', '#38bdf8', '#a855f7', '#f43f5e'],
              borderWidth: 0
            }]
          },
          options: {
            plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', boxWidth: 12 } } }
          }
        });
      } catch (err) {
        document.getElementById("ai-sleep-more").innerText = "Lỗi kết nối Firebase hoặc chưa có dữ liệu.";
      }
    }
    loadSleepData();
  </script>
</body>
</html>
